
<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Mini Task Manager</title>

    <style>
        :root {
            font-family: system-ui, Arial, sans-serif;
            color: #1e293b;
            background: #f1f5f9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 16px;
        }

        .container {
            max-width: 760px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 4px 20px #00000010;
        }

        h1 {
            margin-top: 0;
            color: #1d4ed8;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 24px;
        }

        .stats {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat {
            flex: 1;
            padding: 16px;
            background: #eff6ff;
            border-radius: 10px;
        }

        .stat strong {
            display: block;
            font-size: 26px;
            color: #1d4ed8;
        }

        .stat span {
            color: #475569;
            font-size: 13px;
        }

        .form-row {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            padding: 10px 14px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .secondary {
            background: #e2e8f0;
            color: #334155;
        }

        .danger {
            background: #fee2e2;
            color: #b91c1c;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        li:last-child {
            border-bottom: 0;
        }

        li input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .task-title {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .completed {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .actions {
            display: flex;
            gap: 6px;
        }

        .message {
            min-height: 22px;
            font-size: 14px;
            color: #b91c1c;
        }

        .empty {
            padding: 25px;
            text-align: center;
            color: #94a3b8;
        }

        footer {
            margin-top: 24px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 560px) {
            .card { padding: 18px; }
            .form-row { flex-direction: column; }
            li { flex-wrap: wrap; }
            .actions { margin-left: auto; }
        }
    </style>
</head>

<body>
    <main class="container">
        <section class="card">
            <h1>Mini Task Manager</h1>
            <p class="subtitle">
                Docker Swarm · FastAPI · PostgreSQL
            </p>

            <div class="stats">
                <div class="stat">
                    <strong id="total">0</strong>
                    <span>Összes feladat</span>
                </div>

                <div class="stat">
                    <strong id="completed">0</strong>
                    <span>Elkészült</span>
                </div>
            </div>

            <form id="taskForm" class="form-row">
                <input
                    id="newTask"
                    type="text"
                    maxlength="200"
                    placeholder="Új feladat megnevezése"
                    aria-label="Új feladat"
                    required
                >
                <button class="primary" type="submit">
                    Hozzáadás
                </button>
            </form>

            <p id="message"
               class="message"
               role="status"
               aria-live="polite"></p>

            <h2>Feladatok</h2>

            <ul id="taskList"></ul>
        </section>

        <footer>
            Cloud Computing · Docker Swarm projekt
        </footer>
    </main>

    <script>
        const API = "/api/tasks";

        const list = document.getElementById("taskList");
        const form = document.getElementById("taskForm");
        const input = document.getElementById("newTask");
        const message = document.getElementById("message");

        function showMessage(text) {
            message.textContent = text;
        }

        async function apiRequest(url, options = {}) {
            const response = await fetch(url, options);

            if (!response.ok) {
                throw new Error(
                    "API-hiba: HTTP " + response.status
                );
            }

            if (response.status === 204) {
                return null;
            }

            return response.json();
        }

        async function loadTasks() {
            try {
                const tasks = await apiRequest(API);
                renderTasks(tasks);
                showMessage("");
            } catch (error) {
                showMessage(error.message);
            }
        }

        function renderTasks(tasks) {
            list.replaceChildren();

            document.getElementById("total")
                .textContent = tasks.length;

            document.getElementById("completed")
                .textContent = tasks.filter(
                    task => task.completed
                ).length;

            if (tasks.length === 0) {
                const empty = document.createElement("li");
                empty.className = "empty";
                empty.textContent = "Még nincsenek feladatok.";
                list.appendChild(empty);
                return;
            }

            for (const task of tasks) {
                const li = document.createElement("li");

                const checkbox =
                    document.createElement("input");

                checkbox.type = "checkbox";
                checkbox.checked = task.completed;
                checkbox.setAttribute(
                    "aria-label",
                    "Feladat kész: " + task.title
                );

                checkbox.addEventListener("change",
                    async () => {
                        await updateTask(task.id, {
                            completed: checkbox.checked
                        });
                    }
                );

                const title = document.createElement("span");
                title.className = "task-title";
                title.textContent = task.title;

                if (task.completed) {
                    title.classList.add("completed");
                }

                const actions = document.createElement("div");
                actions.className = "actions";

                const edit = document.createElement("button");
                edit.className = "secondary";
                edit.textContent = "Szerkesztés";

                edit.addEventListener("click", async () => {
                    const newTitle = prompt(
                        "Feladat módosítása:",
                        task.title
                    );

                    if (newTitle === null) return;

                    const trimmed = newTitle.trim();

                    if (!trimmed ||
                        trimmed.length > 200) {
                        showMessage(
                            "A cím 1–200 karakter lehet."
                        );
                        return;
                    }

                    await updateTask(task.id, {
                        title: trimmed
                    });
                });

                const remove = document.createElement("button");
                remove.className = "danger";
                remove.textContent = "Törlés";

                remove.addEventListener("click", async () => {
                    if (!confirm("Töröljük a feladatot?")) {
                        return;
                    }

                    try {
                        await apiRequest(
                            API + "/" + task.id,
                            { method: "DELETE" }
                        );
                        await loadTasks();
                    } catch (error) {
                        showMessage(error.message);
                    }
                });

                actions.append(edit, remove);
                li.append(checkbox, title, actions);
                list.appendChild(li);
            }
        }

        async function updateTask(id, data) {
            try {
                await apiRequest(API + "/" + id, {
                    method: "PATCH",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                await loadTasks();
            } catch (error) {
                showMessage(error.message);
                await loadTasks();
            }
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();

            const title = input.value.trim();

            if (!title) {
                showMessage("Adj meg egy feladatnevet!");
                return;
            }

            try {
                await apiRequest(API, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ title })
                });

                input.value = "";
                await loadTasks();
                input.focus();
            } catch (error) {
                showMessage(error.message);
            }
        });

        loadTasks();
    </script>
</body>
</html>
